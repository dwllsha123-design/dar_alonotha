# Low-memory Nginx for Railway / Docker
# TLS/HTTPS (443) is terminated at the Railway edge — this process speaks HTTP only.
worker_processes 1;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    access_log off;

    # Prefer Railway/proxy forwarded proto so Nest sees https (cookies, redirects, APP_URL)
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    map $http_x_forwarded_port $forwarded_port {
        default $http_x_forwarded_port;
        ""      $server_port;
    }

    # Force HTTPS when the edge proxy says the client used HTTP (avoids redirect loops:
    # container $scheme is always http behind Railway TLS termination).
    map $http_x_forwarded_proto $https_force_redirect {
        default 0;
        http    1;
    }

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
