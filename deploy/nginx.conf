# Reference / local nginx -t without envsubst templates.
# Production image uses nginx.conf.template (Railway PORT + API_UPSTREAM).
# HTTPS/443 is handled by Railway (or host reverse proxy) — this server is HTTP only.

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;
    absolute_redirect off;
    port_in_redirect off;

    resolver 127.0.0.11 [fd12::10] ipv6=on valid=10s;

    root /usr/share/nginx/html;
    index index.html;

    set $api_upstream "api:3000";

    # Same HTTPS force as production template (only when X-Forwarded-Proto=http)
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://$api_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri @uploads_api;
    }

    location @uploads_api {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /r/ {
        proxy_pass http://$api_upstream/r/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /.well-known/ {
        proxy_pass http://$api_upstream/.well-known/;
        proxy_set_header Host $host;
    }

    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
