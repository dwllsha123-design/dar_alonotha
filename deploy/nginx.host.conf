# Host/VPS Nginx (non-Docker). Put TLS on 443 via Certbot/Cloudflare in front.
# Do not terminate SSL inside the Nest process.
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    root /var/www/dar-alunotha;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /uploads/ {
        alias /opt/dar-alunotha/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /r/ {
        proxy_pass http://127.0.0.1:3000/r/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /.well-known/ {
        proxy_pass http://127.0.0.1:3000/.well-known/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
