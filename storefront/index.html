    <title>دار الأنوثة | Dar Al Onoutha — متجر أزياء نسائية في ليبيا</title>
    <meta
      name="description"
      content="دار الأنوثة — متجر ليبي للأزياء النسائية واللانجري والأرواب. تسوّقي بأناقة مع توصيل داخل ليبيا وخصوصية تامة."
    />
    <meta property="og:title" content="دار الأنوثة | Dar Al Onoutha" />
    <meta
      property="og:description"
      content="متجر أزياء نسائية راقٍ في ليبيا — وصل حديثاً، عروض، والأكثر مبيعاً."
    />
    <meta property="og:locale" content="ar_LY" />
    <meta name="theme-color" content="#0c0c0c" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dao-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
