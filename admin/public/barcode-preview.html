<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <title>معاينة شكل الباركود</title>
  <style>
    body {
      font-family: Tahoma, "Segoe UI", sans-serif;
      padding: 24px;
      background: #f3f4f6;
      color: #111;
    }
    h1 { font-size: 18px; margin: 0 0 8px; }
    p { color: #555; font-size: 14px; margin: 0 0 20px; }
    .sheet { display: flex; flex-wrap: wrap; gap: 16px; }
    .label {
      width: 260px;
      border: 1px dashed #999;
      padding: 12px;
      background: #fff;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }
    .code {
      letter-spacing: 2px;
      margin-top: 4px;
      font-size: 13px;
      direction: ltr;
      unicode-bidi: plaintext;
    }
    svg { max-width: 100%; }
  </style>
</head>
<body>
  <h1>شكل ملصق الباركود</h1>
  <p>الشريط CODE128 + الرقم بصيغة DO-00100001.</p>
  <div class="sheet">
    <div class="label">
      <svg id="b0"></svg>
      <div class="code">DO-00100001</div>
    </div>
    <div class="label">
      <svg id="b1"></svg>
      <div class="code">DO-00100002</div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script>
    ['DO-00100001', 'DO-00100002'].forEach((code, i) => {
      try {
        JsBarcode('#b' + i, code, {
          format: 'CODE128',
          width: 1.6,
          height: 48,
          displayValue: false,
          margin: 8,
        });
      } catch (e) {}
    });
  </script>
</body>
</html>
