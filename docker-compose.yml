# Low-resource VPS stack: Nginx (static) + Nest API + SQLite
# No PostgreSQL/Redis containers — keeps RAM under ~700MB at idle.

services:
  api:
    build:
      context: ./backend
    env_file:
      - deploy/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/data/app.db
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=384
      PRISMA_CLI_BINARY_TARGETS: debian-openssl-3.0.x
    volumes:
      - sqlite_data:/data
      - uploads_data:/app/uploads
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: /api/v1
        VITE_BASE: /admin/
    environment:
      # Docker Compose DNS name of the Nest service (see services.api)
      API_UPSTREAM: api:3000
      # HTTP only inside the container (TLS/443 stays at reverse proxy / Railway edge)
      PORT: "80"
    ports:
      - "80:80"
    # Do not publish 443 on the web container — no certs inside this image
    volumes:
      - uploads_data:/var/www/uploads
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"

volumes:
  sqlite_data:
  uploads_data:
