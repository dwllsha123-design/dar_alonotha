# Compose for self-hosted / VPS. Railway production uses managed Postgres + volume.
# Production app requires PostgreSQL (SQLite is legacy tooling only).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dar
      POSTGRES_PASSWORD: dar
      POSTGRES_DB: dar_alonotha
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 256m

  api:
    build:
      context: ./backend
    env_file:
      - deploy/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://dar:dar@postgres:5432/dar_alonotha
      PORT: "3000"
      NODE_OPTIONS: --max-old-space-size=384
      RAILWAY_VOLUME_MOUNT_PATH: /app/uploads
      PRISMA_CLI_BINARY_TARGETS: debian-openssl-3.0.x
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - postgres
    restart: unless-stopped
    mem_limit: 512m
    memswap_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_API_URL: /api/v1
        VITE_BASE: /admin/
    environment:
      API_UPSTREAM: api:3000
      PORT: "80"
    ports:
      - "80:80"
    volumes:
      - uploads_data:/var/www/uploads
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "2m"
        max-file: "2"

volumes:
  pg_data:
  uploads_data:
